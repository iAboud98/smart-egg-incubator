<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
  <title id="title">Smart Egg Incubator electronic schematic</title>
  <desc id="desc">Complete ESP32 incubator schematic with DHT11, OLED, servo, two-channel relay module, heater, fan, buck converter, and 2N2222 buzzer driver.</desc>

  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#e8edf3" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #132238; }
      .subtitle { font: 16px Inter, Arial, sans-serif; fill: #52667a; }
      .ref { font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #101828; }
      .name { font: 700 19px Inter, Arial, sans-serif; fill: #172b4d; }
      .pin { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .net { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #a61b1b; }
      .note { font: 14px Inter, Arial, sans-serif; fill: #52667a; }
      .device { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
      .controller { fill: #eef6ff; stroke: #175cd3; stroke-width: 3; }
      .power-device { fill: #fff8eb; stroke: #b54708; stroke-width: 2.5; }
      .wire { fill: none; stroke: #16794b; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .signal { fill: none; stroke: #175cd3; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .power { fill: none; stroke: #c62828; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
      .ground-wire { fill: none; stroke: #263238; stroke-width: 3; }
      .link { fill: none; stroke: #7b8794; stroke-width: 2; stroke-dasharray: 7 6; }
      .junction { fill: #c62828; }
      .signal-junction { fill: #175cd3; }
    </style>
    <g id="ground">
      <path d="M0 0V10 M-14 10H14 M-9 16H9 M-4 22H4" class="ground-wire"/>
    </g>
    <g id="power-arrow">
      <path d="M0 18V0 M-8 8L0 0L8 8" class="power"/>
    </g>
  </defs>

  <rect width="1800" height="1220" fill="#fbfcfe"/>
  <rect x="30" y="110" width="1740" height="1060" fill="url(#grid)" stroke="#d0d9e4" stroke-width="2"/>
  <text x="55" y="55" class="title">Smart Egg Incubator - Electronic Schematic</text>
  <text x="55" y="84" class="subtitle">ESP32 DevKit V1 | 12 V heater and fan | 5 V servo | FreeRTOS + Blynk</text>

  <!-- USB power -->
  <rect x="70" y="190" width="190" height="85" rx="8" class="device"/>
  <text x="90" y="220" class="ref">J2</text>
  <text x="165" y="222" text-anchor="middle" class="name">USB 5 V</text>
  <text x="165" y="250" text-anchor="middle" class="pin">ESP32 POWER</text>
  <path d="M260 232H350" class="power"/>
  <text x="275" y="221" class="net">USB_5V</text>

  <!-- ESP32 -->
  <rect x="350" y="145" width="390" height="650" rx="12" class="controller"/>
  <text x="375" y="178" class="ref">U1</text>
  <text x="545" y="182" text-anchor="middle" class="name">ESP32 DevKit V1</text>
  <line x1="375" y1="198" x2="715" y2="198" stroke="#9fc4f3" stroke-width="2"/>

  <text x="375" y="238" class="pin">5V / VIN</text>
  <circle cx="730" cy="232" r="5" class="signal-junction"/>
  <text x="375" y="283" class="pin">3V3</text>
  <circle cx="730" cy="277" r="5" class="signal-junction"/>
  <text x="375" y="328" class="pin">GND</text>
  <circle cx="730" cy="322" r="5" fill="#263238"/>
  <text x="375" y="373" class="pin">GPIO4   DHT_DATA</text>
  <circle cx="730" cy="367" r="5" class="signal-junction"/>
  <text x="375" y="423" class="pin">GPIO21  I2C_SDA</text>
  <circle cx="730" cy="417" r="5" class="signal-junction"/>
  <text x="375" y="468" class="pin">GPIO22  I2C_SCL</text>
  <circle cx="730" cy="462" r="5" class="signal-junction"/>
  <text x="375" y="523" class="pin">GPIO18  SERVO_PWM</text>
  <circle cx="730" cy="517" r="5" class="signal-junction"/>
  <text x="375" y="583" class="pin">GPIO25  BUZZER</text>
  <circle cx="730" cy="577" r="5" class="signal-junction"/>
  <text x="375" y="658" class="pin">GPIO26  RELAY_IN1</text>
  <circle cx="730" cy="652" r="5" class="signal-junction"/>
  <text x="375" y="718" class="pin">GPIO27  RELAY_IN2</text>
  <circle cx="730" cy="712" r="5" class="signal-junction"/>

  <path d="M730 232H790" class="power"/>
  <text x="752" y="220" class="net">+5V_ESP</text>
  <path d="M730 277H790" class="power"/>
  <text x="752" y="265" class="net">+3V3</text>
  <path d="M730 322V342" class="ground-wire"/>
  <use href="#ground" x="730" y="342"/>

  <!-- DHT11 -->
  <rect x="875" y="145" width="270" height="145" rx="8" class="device"/>
  <text x="895" y="176" class="ref">TH1</text>
  <text x="1010" y="180" text-anchor="middle" class="name">DHT11 MODULE</text>
  <text x="895" y="215" class="pin">1  VCC</text>
  <text x="895" y="245" class="pin">2  DATA</text>
  <text x="895" y="275" class="pin">3  GND</text>
  <path d="M875 210H835V190" class="power"/>
  <use href="#power-arrow" x="835" y="190"/>
  <text x="795" y="177" class="net">+3V3</text>
  <path d="M730 367H810V240H875" class="signal"/>
  <text x="755" y="354" class="pin">DHT_DATA</text>
  <path d="M875 270H845V292" class="ground-wire"/>
  <use href="#ground" x="845" y="292"/>

  <!-- OLED -->
  <rect x="875" y="325" width="270" height="165" rx="8" class="device"/>
  <text x="895" y="356" class="ref">DS1</text>
  <text x="1010" y="360" text-anchor="middle" class="name">SSD1306 OLED</text>
  <text x="895" y="395" class="pin">1  VCC</text>
  <text x="895" y="425" class="pin">2  GND</text>
  <text x="895" y="455" class="pin">3  SCL</text>
  <text x="895" y="482" class="pin">4  SDA</text>
  <path d="M875 390H835V370" class="power"/>
  <use href="#power-arrow" x="835" y="370"/>
  <text x="795" y="357" class="net">+3V3</text>
  <path d="M875 420H850V442" class="ground-wire"/>
  <use href="#ground" x="850" y="442"/>
  <path d="M730 462H790V450H875" class="signal"/>
  <path d="M730 417H770V477H875" class="signal"/>
  <text x="748" y="406" class="pin">SDA</text>
  <text x="797" y="441" class="pin">SCL</text>

  <!-- Servo -->
  <rect x="875" y="510" width="270" height="145" rx="8" class="device"/>
  <text x="895" y="541" class="ref">M1</text>
  <text x="1010" y="545" text-anchor="middle" class="name">5 V TRAY SERVO</text>
  <text x="895" y="580" class="pin">SIG</text>
  <text x="895" y="610" class="pin">+5V</text>
  <text x="895" y="640" class="pin">GND</text>
  <path d="M730 517H815V575H875" class="signal"/>
  <text x="755" y="505" class="pin">SERVO_PWM</text>
  <path d="M875 605H835V585" class="power"/>
  <use href="#power-arrow" x="835" y="585"/>
  <text x="765" y="572" class="net">+5V_SERVO</text>
  <path d="M875 635H850V657" class="ground-wire"/>
  <use href="#ground" x="850" y="657"/>

  <!-- Buzzer transistor circuit -->
  <text x="1260" y="180" class="ref">BZ1 / Q1</text>
  <text x="1470" y="180" text-anchor="middle" class="name">5 V BUZZER DRIVER</text>
  <path d="M730 577H770V675H1180" class="signal"/>
  <path d="M1180 675l12 -10 16 20 16 -20 16 20 16 -20 12 10" class="signal"/>
  <path d="M1268 675H1285V615H1298" class="signal"/>
  <text x="1188" y="650" class="ref">R1  1 kOhm</text>

  <circle cx="1340" cy="615" r="42" fill="#fff" stroke="#334155" stroke-width="2.5"/>
  <path d="M1298 615H1315 M1315 590V640 M1315 597L1360 565 M1315 633L1360 665" class="ground-wire"/>
  <path d="M1348 656l12 9 -2 -15" fill="#263238"/>
  <text x="1387" y="622" class="ref">Q1</text>
  <text x="1387" y="644" class="pin">2N2222</text>
  <path d="M1360 665V690" class="ground-wire"/>
  <use href="#ground" x="1360" y="690"/>

  <circle cx="1500" cy="435" r="34" fill="#fff" stroke="#334155" stroke-width="2.5"/>
  <path d="M1500 401V365" class="power"/>
  <use href="#power-arrow" x="1500" y="345"/>
  <text x="1455" y="326" class="net">+5V_ESP</text>
  <path d="M1485 423q15 -18 30 0q-15 18 -30 0 M1500 469V565H1360" class="ground-wire"/>
  <text x="1543" y="430" class="ref">BZ1</text>
  <text x="1543" y="452" class="pin">5 V</text>

  <!-- Zener in parallel with buzzer -->
  <path d="M1610 365V405" class="power"/>
  <path d="M1595 405H1625 M1595 410L1625 400" class="ground-wire"/>
  <path d="M1595 445L1625 425L1595 405Z" fill="#ffffff" stroke="#263238" stroke-width="2.5"/>
  <path d="M1610 445V565H1500" class="ground-wire"/>
  <path d="M1500 365H1610" class="power"/>
  <text x="1640" y="416" class="ref">D1</text>
  <text x="1640" y="438" class="pin">ZENER</text>

  <!-- Relay module -->
  <rect x="875" y="730" width="300" height="205" rx="8" class="power-device"/>
  <text x="895" y="756" class="ref">U3</text>
  <text x="1025" y="782" text-anchor="middle" class="name">2-CH 12 V RELAY MODULE</text>
  <text x="895" y="820" class="pin">IN1  K1 HEATER</text>
  <text x="895" y="855" class="pin">IN2  K2 FAN</text>
  <text x="895" y="890" class="pin">VCC  +12V</text>
  <text x="895" y="920" class="pin">GND</text>
  <path d="M730 652H805V815H875" class="signal"/>
  <path d="M730 712H785V850H875" class="signal"/>
  <text x="748" y="642" class="pin">IN1</text>
  <text x="748" y="701" class="pin">IN2</text>
  <path d="M1175 785H1215" class="link"/>
  <path d="M1175 835H1215" class="link"/>
  <path d="M875 885H835V865" class="power"/>
  <use href="#power-arrow" x="835" y="840"/>
  <text x="787" y="820" class="net">+12V</text>
  <path d="M875 915H845V937" class="ground-wire"/>
  <use href="#ground" x="845" y="937"/>

  <!-- K1 heater relay contact -->
  <text x="1270" y="735" class="ref">K1 HEATER RELAY</text>
  <path d="M1240 790V770" class="power"/>
  <use href="#power-arrow" x="1240" y="750"/>
  <text x="1170" y="750" class="net">+12V</text>
  <circle cx="1240" cy="790" r="5" fill="#263238"/>
  <circle cx="1335" cy="770" r="5" fill="#263238"/>
  <path d="M1240 790L1320 773" class="ground-wire"/>
  <path d="M1335 770H1385" class="power"/>
  <rect x="1385" y="748" width="115" height="44" rx="5" class="device"/>
  <text x="1442" y="776" text-anchor="middle" class="ref">TF1 CUTOFF</text>
  <path d="M1500 770H1530" class="power"/>
  <rect x="1530" y="730" width="190" height="80" rx="8" class="power-device"/>
  <text x="1548" y="752" class="ref">H1</text>
  <text x="1635" y="785" text-anchor="middle" class="name">12 V HEATER</text>
  <path d="M1625 810V835" class="ground-wire"/>
  <use href="#ground" x="1625" y="835"/>
  <text x="1270" y="812" class="pin">COM</text>
  <text x="1330" y="752" class="pin">NO</text>
  <text x="1220" y="835" class="pin">NC unused</text>

  <!-- K2 fan relay contact -->
  <text x="1210" y="868" class="ref">K2 FAN RELAY</text>
  <path d="M1240 930V910" class="power"/>
  <use href="#power-arrow" x="1240" y="890"/>
  <text x="1180" y="842" class="net">+12V</text>
  <circle cx="1240" cy="930" r="5" fill="#263238"/>
  <circle cx="1335" cy="910" r="5" fill="#263238"/>
  <path d="M1240 930L1320 913" class="ground-wire"/>
  <path d="M1335 910H1570" class="power"/>
  <circle cx="1625" cy="910" r="55" fill="#fff" stroke="#334155" stroke-width="2.5"/>
  <path d="M1625 965V985" class="ground-wire"/>
  <use href="#ground" x="1625" y="985"/>
  <path d="M1625 910m-35 0h70 M1625 875v70 M1597 882l56 56 M1653 882l-56 56" stroke="#334155" stroke-width="2"/>
  <text x="1690" y="902" class="ref">M2</text>
  <text x="1690" y="924" class="pin">12 V FAN</text>
  <text x="1270" y="952" class="pin">COM</text>
  <text x="1330" y="892" class="pin">NO</text>
  <text x="1220" y="975" class="pin">NC unused</text>

  <!-- 12 V source -->
  <rect x="70" y="920" width="190" height="125" rx="8" class="power-device"/>
  <text x="90" y="946" class="ref">J1</text>
  <text x="165" y="975" text-anchor="middle" class="name">12 V DC INPUT</text>
  <text x="90" y="1010" class="pin">1  +12V</text>
  <text x="90" y="1038" class="pin">2  GND</text>
  <path d="M260 990H300" class="power"/>
  <circle cx="280" cy="990" r="5" class="junction"/>
  <path d="M280 990V900" class="power"/>
  <use href="#power-arrow" x="280" y="880"/>
  <text x="230" y="862" class="net">+12V</text>
  <path d="M260 1020H280V1040" class="ground-wire"/>
  <use href="#ground" x="280" y="1040"/>

  <!-- Buck converter -->
  <rect x="330" y="900" width="330" height="160" rx="8" class="power-device"/>
  <text x="350" y="932" class="ref">U2</text>
  <text x="495" y="935" text-anchor="middle" class="name">12 V -> 5 V BUCK</text>
  <text x="350" y="975" class="pin">IN+  +12V</text>
  <text x="350" y="1015" class="pin">IN-  GND</text>
  <text x="540" y="975" class="pin">OUT+  +5V_SERVO</text>
  <text x="540" y="1015" class="pin">OUT-  GND</text>
  <path d="M300 990H330" class="power"/>
  <path d="M330 1010H310V1032" class="ground-wire"/>
  <use href="#ground" x="310" y="1032"/>
  <path d="M660 970H710V940" class="power"/>
  <use href="#power-arrow" x="710" y="920"/>
  <text x="675" y="900" class="net">+5V_SERVO</text>
  <path d="M660 1010H690V1032" class="ground-wire"/>
  <use href="#ground" x="690" y="1032"/>

  <!-- Notes -->
  <rect x="70" y="1090" width="1650" height="55" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="895" y="1115" text-anchor="middle" class="note">All GND symbols share one common ground: 12 V negative, ESP32 GND, buck GND, relay GND, servo GND, sensor GND, OLED GND, and Q1 emitter.</text>
  <text x="895" y="1137" text-anchor="middle" class="note">K1 and K2 use normally-open contacts so the heater and fan default to OFF. Relay inputs are active LOW.</text>
</svg>
